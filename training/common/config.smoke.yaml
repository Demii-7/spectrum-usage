data:
  representation: 2d
  files:
    - evaluation/aerpaw/ResultsCC2Feb2022_SigMF_power_1mhz_avg_per_minute.csv
  concat: rows
  split:
    test_rows: 60
  band_definitions_path: evaluation/results/step2/band_definitions.csv
  reference_site: CC2
  frequency_ranges:
    - [600.0, 800.0]
  max_rows: 600
  chunks:
    - id: chunk_600_800
      start_mhz: 600.0
      end_mhz: 800.0

windowing:
  lookback: 60
  horizons: [1, 5, 15, 60]

preprocessing:
  normalize: true
  impute: true
  max_missing_gap: 2

outputs:
  root_dir: training/results

training:
  device: auto
  model_name: vanillalstm

linear_autoregressive:
  ridge_alpha: 1.0
  seed: 42
  device: auto

convlstm:
  evaluation: {}
  model:
    input_sequence_length: 60
    prediction_horizon: 60
    hidden_channels: [16, 32]
    kernel_size: [[1, 3], [1, 1]]
    num_encoder_layers: 2
    decoder_hidden_channels: 16
    decoder_kernel_size: [1, 1]
    dropout: 0.1
    use_batch_norm: true
    decoder_lstm_hidden: 64
    fc_hidden_channels: 0
    fc_kernel_size: [1, 3]
    cell_activation: relu
    fc_intermediate_activation: relu
    use_channel_projection: false
    channel_projection_dim: 16
  train:
    train_stride: 1
    val_stride: 1
    batch_size: 8
    epochs: 1
    learning_rate: 0.0002
    weight_decay: 0.004
    val_fraction: 0.1
    gradient_clip_norm: 5.0
    early_stopping: true
    early_stopping_patience: 8
    seed: 42

stsprednet:
  lc: 6
  lp: 3
  lq: 0
  period_interval: 30
  trend_interval: 0
  batch_size: 8
  epochs: 1
  learning_rate: 0.0002
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  patience: 4
  seed: 42
  device: auto
  model:
    input_channels: 1
    map_height: 1
    hidden_dim: 64
    num_layers: 2
    kernel_size: [1, 3]
    output_activation: tanh
    fusion_weight_shape: per_location
    output_channels: 1

timeran:
  batch_size: 1
  epochs: 1
  learning_rate: 1.0e-5
  max_learning_rate: 1.0e-4
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  checkpoint_size: small
  training_mode: linear_probing
  seed: 42
  device: auto

tss_lcd:
  hidden_dim: 128
  attention_heads: 4
  ffn_dim: 256
  num_attention_layers: 1
  dropout: 0.1
  use_temporal_branch: true
  use_spectral_branch: true
  use_spatial_branch: true
  latent_dim: 16
  autoencoder_num_blocks: 2
  autoencoder_initial_channels: 16
  diffusion_steps: 50
  noise_schedule: cosine
  nen_encoder_channels: [32, 64]
  nen_bottleneck_channels: 128
  nen_decoder_channels: [64, 32]
  nen_kernel_size: 3
  time_embed_dim: 16
  batch_size: 4
  autoencoder_epochs: 1
  autoencoder_learning_rate: 0.0001
  tss_epochs: 1
  tss_learning_rate: 0.0001
  diffusion_epochs: 1
  diffusion_learning_rate: 0.0001
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  patience: 2
  seed: 42
  device: auto

vanillalstm:
  evaluation: {}
  model:
    input_sequence_length: 60
    prediction_horizon: 60
    hidden_size: 64
    num_layers: 1
    dropout: 0.1
    output_strategy: final_hidden
    bidirectional: false
  train:
    train_stride: 1
    val_stride: 1
    test_stride: 1
    batch_size: 16
    epochs: 1
    learning_rate: 0.001
    optimizer: adam
    gradient_clip_norm: 1.0
    early_stopping: false
    early_stopping_patience: 2
    val_fraction: 0.1
    weight_decay: 0.0
    seed: 42

autoformer_csa:
  seq_len: 30
  label_len: 15
  pred_len: 60
  train_stride: 1
  val_stride: 60
  test_stride: 60
  batch_size: 4
  epochs: 1
  learning_rate: 0.001
  optimizer: adam
  loss: rmse
  gradient_clip: 5.0
  early_stopping: false
  patience: 2
  architecture:
    model_variant: autoformer_csa
  model:
    d_model: 32
    d_ff: 128
    encoder_layers: 1
    decoder_layers: 1
    n_heads: 4
    moving_avg: 7
    dropout: 0.1
    factor: 3
    activation: relu
    embed: timeF
    freq: h
    csam_kernel_size: 7
    csam_reduction: 16
    output_attention: false
  seed: 42
  device: auto

dswinlstm_i:
  input_sequence_length: 20
  prediction_horizon: 60
  train_stride: 30
  val_stride: 60
  test_stride: 60
  batch_size: 1
  epochs: 1
  learning_rate: 0.0001
  optimizer: adam
  loss: mse
  gradient_clip: 5.0
  early_stopping: false
  patience: 2
  teacher_forcing_ratio: 1.0
  normalization: minmax
  minmax_range: [-1, 1]
  missing_rate: 0.3
  missing_strategy: random
  model:
    patch_shape: [1, 2]
    embed_dim: 16
    hidden_dims: [16, 32]
    encoder_units: 2
    decoder_units: 2
    swin_depths: [1, 1, 1, 1]
    num_heads: [2, 2, 2, 2]
    window_size: 2
    use_patch_merging: true
    use_patch_expanding: true
    use_imputation_unit: true
    mask_as_input_channel: false
    output_activation: tanh
    decoder_feedback: pixel_feedback
    padding_mode: reflect
  seed: 42
  device: auto

deepspred:
  minutes_per_frame: 64
  input_frames: 1
  output_frames: 1
  stride: 1
  batch_size: 1
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.05
  colormap: jet
  normalization: minmax
  model:
    embed_dim: 16
    depths: [1, 1, 1]
    num_heads: [2, 2, 2]
    patch_size: [1, 4, 4]
    window_size: [1, 4, 4]
    mlp_ratio: 4.0
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.0
  patience: 2
  early_stopping_threshold: 0.01
  early_stopping_epochs: 2
  seed: 42
  device: auto
