data:
  loader: powder
  data_dir: 
  band_definitions_path:
  reference_site:
  train_files: [data/powder_20260618T0036Z_humanities_600_800.csv, data/powder_20260618T0036Z_guesthouse_600_800.csv]
  test_files: [data/powder_20260628T0436Z_humanities_600_800.csv, data/powder_20260628T0436Z_guesthouse_600_800.csv]
  train_map_path:
  test_map_path:
  map_key: map_db
  chunk_id:
  max_rows:
  test_rows: 2880
  chunks:
    - id: powder_600_800
      start_mhz: 600.0
      end_mhz: 800.0
windowing:
  lookback: 60
  horizons: [1, 5, 15, 60]
  min_history: 60

preprocessing:
  normalize: true
  # NaN imputation for interpolated-map mode.
  imputation:
    enabled: true
    window_steps: 2

outputs:
  root_dir: training/results/powder/vanillalstm/600_800

evaluation:
  prediction_start_row:

linear_autoregressive:
  ridge_alpha: 1.0
  seed: 42
  device: auto

convlstm:
  input_sequence_length: 60
  prediction_horizon: 60
  batch_size: 32
  epochs: 25
  learning_rate: 0.0002
  weight_decay: 0.004
  val_fraction: 0.1
  teacher_forcing_ratio: 1.0
  gradient_clip_norm: 5.0
  seed: 42
  device: auto
  model:
    input_channels: 1
    hidden_channels: [32, 64]
    kernel_size: [[1, 3], [1, 1]]
    num_encoder_layers: 2
    decoder_hidden_channels: 32
    decoder_kernel_size: [1, 1]
    dropout: 0.3
    use_batch_norm: true
    decoder_lstm_hidden: 128
    fc_hidden_channels: 0
    fc_kernel_size: [1, 3]
    cell_activation: "relu"
    fc_intermediate_activation: "relu"
    use_channel_projection: false
    channel_projection_dim: 16

stsprednet:
  lc: 36
  lp: 3
  lq: 4
  period_interval: 1440
  trend_interval: 10080
  batch_size: 32
  epochs: 25
  learning_rate: 0.0002
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  patience: 30
  seed: 42
  device: auto
  model:
    input_channels: 1
    map_height: 1
    hidden_dim: 128
    num_layers: 4
    kernel_size: [1, 3]
    output_activation: tanh
    fusion_weight_shape: per_location
    # Output channels for the PredRNN 1x1 output projection.
    #   1        — single-channel CSV mode (default, backward-compatible)
    #   >1       — multi-channel map mode (e.g., 200 for (F, H, W) maps)
    output_channels: 1
  # Interpolated-map input mode (alternative to the CSV-based pipeline).
  # Set enabled: true to use pre-interpolated .npz grid maps instead of
  # per-chunk AERPAW data.  shape: (T, H, W, F) -> (T, F, H, W).
  interpolated_map:
    enabled: false
    map_path: "evaluation/interpolated_maps/idw_ames_curtiss_600_800.npz"
    map_key: "map_db"
    n_freq_bins: 200
    grid_height: 50
    grid_width: 50
    # Temporal overrides for shorter map-mode datasets (~244 timesteps).
    # The default CSV params (lc=36, period_interval=1440) are too large.
    temporal_overrides:
      lc: 6
      lp: 2
      period_interval: 6

timeran:
  batch_size: 1
  epochs: 10
  learning_rate: 1.0e-5
  max_learning_rate: 1.0e-4
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  checkpoint_size: base
  training_mode: linear_probing
  seed: 42
  device: auto

tss_lcd:
  hidden_dim: 256
  attention_heads: 4
  ffn_dim: 1024
  num_attention_layers: 2
  dropout: 0.1
  use_temporal_branch: true
  use_spectral_branch: true
  use_spatial_branch: true
  latent_dim: 32
  autoencoder_num_blocks: 3
  autoencoder_initial_channels: 32
  diffusion_steps: 1000
  noise_schedule: cosine
  nen_encoder_channels: [64, 128]
  nen_bottleneck_channels: 256
  nen_decoder_channels: [128, 64]
  nen_kernel_size: 3
  time_embed_dim: 32
  batch_size: 32
  autoencoder_epochs: 300
  autoencoder_learning_rate: 0.0001
  tss_epochs: 200
  tss_learning_rate: 0.0001
  diffusion_epochs: 1000
  diffusion_learning_rate: 0.0001
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  patience: 30
  seed: 42
  device: auto

vanillalstm:
  input_sequence_length: 60
  prediction_horizon: 60
  train_stride: 1
  val_stride: 60
  test_stride: 60
  batch_size: 32
  epochs: 20
  learning_rate: 0.001
  optimizer: adam
  hidden_size: 128
  num_layers: 1
  dropout: 0.1
  output_strategy: final_hidden
  bidirectional: false
  gradient_clip: 1.0
  early_stopping: true
  patience: 10
  seed: 42
  device: auto

autoformer_csa:
  seq_len: 60
  label_len: 30
  pred_len: 60
  train_stride: 1
  val_stride: 60
  test_stride: 60
  batch_size: 8
  epochs: 10
  learning_rate: 0.0005
  optimizer: adam
  loss: rmse
  gradient_clip: 5.0
  early_stopping: true
  patience: 6
  architecture:
    model_variant: autoformer_csa
  model:
    d_model: 64
    d_ff: 256
    encoder_layers: 1
    decoder_layers: 1
    n_heads: 4
    moving_avg: 13
    dropout: 0.1
    factor: 3
    activation: relu
    embed: timeF
    freq: h
    csam_kernel_size: 7
    csam_reduction: 16
    output_attention: false
  seed: 42
  device: auto

dswinlstm_i:
  input_sequence_length: 60
  prediction_horizon: 60
  train_stride: 1
  val_stride: 60
  test_stride: 60
  batch_size: 2
  epochs: 6
  learning_rate: 0.0001
  optimizer: adam
  loss: mse
  gradient_clip: 5.0
  early_stopping: true
  patience: 6
  teacher_forcing_ratio: 1.0
  normalization: minmax
  minmax_range: [-1, 1]
  missing_rate: 0.3
  missing_strategy: random
  model:
    patch_shape: [1, 2]
    embed_dim: 32
    hidden_dims: [32, 64]
    encoder_units: 2
    decoder_units: 2
    swin_depths: [1, 1, 1, 1]
    num_heads: [2, 4, 4, 2]
    window_size: 4
    use_patch_merging: true
    use_patch_expanding: true
    use_imputation_unit: true
    mask_as_input_channel: false
    output_activation: tanh
    decoder_feedback: pixel_feedback
    padding_mode: reflect
  seed: 42
  device: auto

deepspred:
  minutes_per_frame: 60
  input_frames: 1
  output_frames: 1
  stride: 1
  batch_size: 2
  epochs: 6
  learning_rate: 0.001
  weight_decay: 0.05
  colormap: jet
  normalization: minmax
  model:
    embed_dim: 32
    depths: [2, 2, 2]
    num_heads: [2, 4, 4]
    patch_size: [1, 4, 4]
    window_size: [1, 7, 7]
    mlp_ratio: 4.0
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.0
  patience: 4
  early_stopping_threshold: 0.01
  early_stopping_epochs: 4
  seed: 42
  device: auto
