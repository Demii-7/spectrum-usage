# Shared configuration for the integrated spectrum-prediction pipeline.
#
# This file defines the data sources, preprocessing behavior, frequency chunks,
# windowing policy, model architecture, training parameters, evaluation
# settings, runtime options, and output locations used throughout the project.
#
# The same configuration is consumed by both training and evaluation so that
# model construction, data preparation, forecasting horizons, normalization,
# and output naming remain consistent across the complete workflow.
#

data:
    representation: 2d
    band_definitions_path: evaluation/results/statistical_analysis/frequency_segments_600_800.csv
    reference_site: guesthouse # No space use underscore or camel case
    files:
      - path: data/powder_20260618T0036Z_guesthouse_600_800.csv
        partition: train
      - path: data/powder_20260618T0036Z_humanities_600_800.csv
        partition: train
      - path: data/powder_20260628T0436Z_guesthouse_600_800.csv
        partition: test
      - path: data/powder_20260628T0436Z_humanities_600_800.csv
        partition: test
    map:
      name: powder_600_800
      locations: data/locations/powder.json
      collection_key: endpoints
      output_dir: data/maps
      grid:
        height: 10
        width: 10
      force_rebuild: false
      permute: false
      permute_seed: 42
    concat: rows
    # Optional inclusive UTC ranges. Validation is loaded separately from the
    # train-partition files; when omitted, each model's val_fraction is used.
    # split:
    #   ranges:
    #     train: {start: "2026-06-28T04:37:00Z", end: "2026-07-02T02:23:00Z"}
    #     validation: {start: "2026-07-02T02:24:00Z", end: "2026-07-03T02:23:00Z"}
    #     test:
    #       - {start: "2026-07-03T18:39:00Z", end: "2026-07-04T14:48:00Z"}
    #       - {start: "2026-07-05T18:39:00Z", end: "2026-07-06T14:48:00Z"}
    # Optional for 2d/4d: preserve these ranges and replace all other
    # frequency channels with the configured dBm noise floor.
    # mask:
    #   frequency_ranges: [[650.0, 660.0]]
    #   noise_floor: -120.0
    prediction_start_row:
    max_rows: # Allows taking a smaller duration: end time 
    chunks:
    - id: powder_600_800
      start_mhz: 600.0
      end_mhz: 800.0

data_loader:
  num_workers: 0
  persistent_workers: false
  prefetch_factor:
  pin_memory: auto
  multiprocessing_context:

windowing:
  lookback: 60
  horizons: [1, 5, 15, 60]

training:
    device: auto
    # Models: linear_autoregressive, convlstm, stsprednet, timeran, tss_lcd, vanillalstm, autoformer_csa, dswinlstm_i, deepspred
    model_name: autoformer_csa 
    

preprocessing:
  normalize: true
  impute: true
  max_missing_gap: 5
     


#----- ALL IMPLEMENTED MODELS' CONFIGURATION SETTINGS -----
linear_autoregressive:
  ridge_alpha: 1.0
  seed: 42

vanillalstm:
  evaluation: {}
  #These parameters are for model definition
  model:
    input_sequence_length: 60            # Number of past sequence / lookback
    prediction_horizon: 1                # Horizon, all N done simultaneously by the model
    hidden_size: 128                     # Hidden state size
    num_layers: 1                        # Number of LSTM layers to stack
    dropout: 0.1                         # Set dropout percentage. Active only when num_layers > 1
    output_strategy: final_hidden        # Hidden state output strategy: final_hidden or all_hidden
    bidirectional: false                 # false for forward LSTM and true for both forward and backward lstm
    
  #These parameters are for training
  train:
    val_fraction: 0.15                   # Fraction of training data held out for validation
    train_stride: 1                     # Step size between consecutive training windows
    val_stride: 1                       # Step size between consecutive validation windows
    test_stride: 1                      # Step size between consecutive test windows (used in evaluation)
    batch_size: 32                      # Number of samples per gradient update
    epochs: 100                          # Number of full passes over the training data
    learning_rate: 0.005                # Optimizer learning rate
    weight_decay: 1.0e-4                  # L2 weight-decay regularization strength
    optimizer: adam                     # Optimizer: adam, adamw, or sgd
    gradient_clip_norm: 1.0             # Maximum global gradient norm for clipping
    early_stopping: false                # Stop training when validation loss stops improving
    early_stopping_patience: 10         # Number of epochs without improvement before stopping
    seed: 42                            # Random seed for reproducibility

temporalconvnet:
  evaluation: {}
  model:
    input_sequence_length: 60
    prediction_horizon: 1               # Longer forecasts use shared autoregressive rollout
    feature_mode: joint                 # Mix frequency bins; use independent for the cited local TCN
    hidden_channels: [32, 32, 32, 32, 32, 32]
    kernel_size: 2
    dropout: 0.1
    leveled_init: true
  train:
    val_fraction: 0.1
    train_stride: 1
    val_stride: 1
    test_stride: 1
    batch_size: 32
    epochs: 20
    learning_rate: 0.001
    weight_decay: 0.0
    optimizer: adam
    gradient_clip_norm: 1.0
    early_stopping: true
    early_stopping_patience: 10
    seed: 42

lstmattn:
  evaluation: {}
  model:
    input_sequence_length: 60
    prediction_horizon: 60
    hidden_size: 128
    attention_size: 128
    num_layers: 1
    dropout: 0.1
  train:
    val_fraction: 0.1
    train_stride: 1
    val_stride: 1
    test_stride: 1
    batch_size: 32
    epochs: 20
    learning_rate: 0.001
    weight_decay: 0.0
    optimizer: adam
    gradient_clip_norm: 1.0
    early_stopping: true
    early_stopping_patience: 10
    seed: 42

arima:
  evaluation: {}
  model:
    input_sequence_length: 60
    prediction_horizon: 60
    p: 1
    d: 1
    q: 0                              # Moving-average terms require an external ARIMA solver
    ridge: 0.000001
  train:
    val_fraction: 0.1
    train_stride: 1
    val_stride: 1
    test_stride: 1
    batch_size: 32
    epochs: 1
    learning_rate: 0.001
    optimizer: adam
    early_stopping: false
    seed: 42

convlstm:
    evaluation: {}
    #These parameters are for model definition
    model:
        input_sequence_length: 60           # Number of past sequence / lookback
        prediction_horizon: 1              # Horizon, all N done simultaneously by the model
        hidden_channels: [32, 64]           # Size of hidden state 1 per lstmlayer
        kernel_size: [[1, 3], [1, 1]]       # Convolution kernels 1 per lstmlayer
        num_encoder_layers: 2               # Number of stacked ConvLSTM layers
        decoder_hidden_channels: 32         # Hidden channel count for the decoder ConvLSTMCell
        decoder_kernel_size: [1, 1]         # Convolution kernel for the decoder cell [height, width]
        dropout: 0.3                        # Set dropout percentage after decoder cell
        use_batch_norm: false
        decoder_lstm_hidden: 128            # Hidden size of the transfer LSTM bottleneck
        
        fc_hidden_channels: 0               # Add fc layers to make model think deeper before ouput
        fc_kernel_size: [1, 3]              # Kernel dim for fc layer (only active for fc_hidden_channels > 0)
        fc_intermediate_activation: "relu"  # Set actavtion fc layer (only active for fc_hidden_channels > 0)
        
        cell_activation: "tanh"             # Activation for cell candidate and cell-state output
        
        use_channel_projection: false       # Channel ptojection true compresses channels into lower dimm super feature
        channel_projection_dim: 16          # Dimension after channel projection (only active for use_channel_projection true)

    #These parameters are for training
    train:
        train_stride: 1                     # Step size between consecutive training windows
        val_stride: 1                       # Step size between consecutive validation windows
        test_stride: 1                      # Step size between consecutive test windows (used in evaluation)
        batch_size: 32                      # Number of samples per gradient update
        epochs: 30                          # Number of full passes over the training data
        learning_rate: 0.0002               # Optimizer learning rate
        weight_decay: 0.004                 # L2 weight-decay regularization strength
        val_fraction: 0.15                   # Fraction of training data held out for validation
        optimizer: adam                     # Optimizer: adam, adamw, or sgd
        early_stopping: false                # Stop training when validation loss stops improving
        early_stopping_patience: 8          # Number of epochs without improvement before stopping
        gradient_clip_norm: 5.0             # Maximum global gradient norm for clipping
        validation_prediction_magnitude_threshold: 20.0 # Normalized units; epochs above this cannot be selected
        seed: 42                            # Random seed for reproducibility

timeran:
  evaluation: {}
  #These parameters are for model definition
  model:
    input_sequence_length: 60            # Number of past sequence / lookback
    prediction_horizon: 1               # 1 for one-step autoregressive rollout
    checkpoint_size: base               # Pretrained MOMENT backbone size: small, base, or large
    use_timeran_checkpoint: true        # Load the matching checkpoint from training/TimeRAN/checkpoints
    freeze_encoder: true                # Freeze MOMENT encoder weights during head training
    freeze_embedder: true               # Freeze MOMENT embedder weights during head training
    freeze_head: false                  # Allow the forecasting head to update

  #These parameters are for training
  train:
    val_fraction: 0.1                   # Fraction of training data held out for validation
    train_stride: 1                     # Step size between consecutive training windows
    val_stride: 1                       # Step size between consecutive validation windows
    batch_size: 1                       # Number of samples per gradient update
    epochs: 50                          # Number of full passes over the training data
    learning_rate: 0.00001              # Optimizer learning rate
    weight_decay: 0.0                   # L2 weight-decay regularization strength
    optimizer: adam                     # Optimizer: adam, adamw, or sgd
    gradient_clip_norm: 5.0             # Maximum global gradient norm for clipping
    early_stopping: true                # Stop training when validation loss stops improving
    early_stopping_patience: 10         # Number of epochs without improvement before stopping
    seed: 42                            # Random seed for reproducibility


dswinlstm_i:
  evaluation: {}
  #These parameters are for model definition
  model:
    input_sequence_length: 60            # Number of past sequence / lookback
    prediction_horizon: 60               # Multi-step prediction horizon (direct output)
    patch_shape: [1, 1]                  # Small-grid adaptation of the paper's spatial patch embedding
    embed_dim: 32                        # Base embedding dimension
    hidden_dims: [32, 64]                # Hidden dimensions for each encoder stage
    encoder_units: 2                     # Number of SwinLSTM encoder units
    decoder_units: 2                     # Number of SwinLSTM decoder units
    swin_depths: [1, 2, 2, 1]           # Swin Transformer depth per stage
    num_heads: [2, 4, 4, 2]             # Attention heads per stage
    window_size: 2                       # Reduced from the paper's 4 for the 10x10 map
    use_patch_merging: true              # Downsample between encoder stages via patch merging
    use_patch_expanding: true            # Upsample between decoder stages via patch expanding
    use_imputation_unit: true            # Enable imputation within encoder SwinLSTMCellI
    mask_as_input_channel: false         # Concatenate mask as extra input channel
    output_activation: none              # Shared preprocessing is z-score, so output must be unbounded
    decoder_feedback: pixel_feedback     # Decoder feedback strategy: pixel_feedback
    padding_mode: reflect                # Padding for spatial boundaries: reflect or replicate
    drop_path_rate: 0.0                  # Avoid recurrent stochastic depth in the shallow adaptation
    
  #These parameters are for training
  train:
    train_stride: 5                      # Step size between consecutive training windows
    val_stride: 10                       # Step size between consecutive validation windows
    test_stride: 60                      # Step size between consecutive test windows (used in evaluation)
    batch_size: 2                        # Number of samples per gradient update
    epochs: 50                           # Practical budget for the recurrent Swin architecture
    learning_rate: 0.0001                # Optimizer learning rate
    weight_decay: 0.0                    # L2 weight-decay regularization strength
    optimizer: adam                      # Optimizer: adam, adamw, or sgd
    gradient_clip_norm: 5.0              # Maximum global gradient norm for clipping
    early_stopping: true                 # Stop training when validation loss stops improving
    early_stopping_patience: 10          # Number of epochs without improvement before stopping
    seed: 42                             # Random seed for reproducibility






stsprednet:
  # The paper uses all three branches. Disable period or trend when the
  # corresponding daily/weekly history is unavailable.
  use_closeness: true
  use_period: false
  use_trend: false
  allow_unavailable_branches: false
  lc: 36
  lp: 3
  lq: 4
  period_interval: 1440
  trend_interval: 10080
  batch_size: 32
  epochs: 25
  learning_rate: 0.0002
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  early_stopping_patience: 30
  seed: 42
  model:
    input_channels: 1
    map_height: 1
    hidden_dim: 128
    num_layers: 4
    kernel_size: [1, 3]
    # Use tanh only with the paper's [-1, 1] min-max preprocessing. The shared
    # loader uses z-score values, so its compatible default is unbounded.
    output_activation: none
    fusion_weight_shape: per_location
    # Output channels for the PredRNN 1x1 output projection.
    #   1        — single-channel CSV mode (default, backward-compatible)
    #   >1       — multi-channel map mode (e.g., 200 for (F, H, W) maps)
    output_channels: 1
  # Interpolated-map input mode (alternative to the CSV-based pipeline).
  # Set enabled: true to use pre-interpolated .npz grid maps instead of
  # per-chunk AERPAW data.  shape: (T, H, W, F) -> (T, F, H, W).
  interpolated_map:
    enabled: false
    map_path: "evaluation/interpolated_maps/idw_ames_curtiss_600_800.npz"
    map_key: "map_db"
    n_freq_bins: 200
    grid_height: 50
    grid_width: 50
    # Temporal overrides for shorter map-mode datasets (~244 timesteps).
    # The default CSV params (lc=36, period_interval=1440) are too large.
    temporal_overrides:
      lc: 6
      lp: 2
      period_interval: 6


tss_lcd:
  hidden_dim: 256
  attention_heads: 4
  ffn_dim: 1024
  num_attention_layers: 2
  dropout: 0.1
  use_temporal_branch: true
  use_spectral_branch: true
  use_spatial_branch: true
  latent_dim: 32
  autoencoder_num_blocks: 3
  autoencoder_initial_channels: 32
  diffusion_steps: 1000
  noise_schedule: cosine
  nen_encoder_channels: [64, 128]
  nen_bottleneck_channels: 256
  nen_decoder_channels: [128, 64]
  nen_kernel_size: 3
  time_embed_dim: 32
  batch_size: 32
  autoencoder_epochs: 300
  autoencoder_learning_rate: 0.0001
  tss_epochs: 200
  tss_learning_rate: 0.0001
  diffusion_epochs: 1000
  diffusion_learning_rate: 0.0001
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  early_stopping_patience: 30
  seed: 42
  preprocessing:
    missing_rate: 0.25
    masking_strategy: random
    zero_pad_missing: true

deepspred:
  # Grouped dBm rows are an adaptation of the paper's native RGB STFT input.
  minutes_per_frame: 256
  input_frames: 2
  output_frames: 1
  stride: 1
  w_pad: 256
  colormap: jet
  normalization: minmax
  model:
    embed_dim: 96
    depths: [2, 4, 2]
    num_heads: [4, 8, 16]
    decoder_num_heads: [16, 8, 4]
    patch_size: [2, 4, 4]
    window_size: [2, 7, 7]
    mlp_ratio: 4.0
    qkv_bias: true
    drop_rate: 0.0
    attn_drop_rate: 0.0
    drop_path_rate: 0.1
  train:
    batch_size: 1
    epochs: 20
    learning_rate: 0.001
    weight_decay: 0.05
    early_stopping_epochs: 4
    seed: 42
    device: auto

autoformer_csa:
  evaluation: {}

  model:
    input_sequence_length: 96
    prediction_horizon: 60
    label_len: 48

    d_model: 512
    d_ff: 2048
    encoder_layers: 2
    decoder_layers: 1
    n_heads: 8
    moving_avg: 25
    dropout: 0.05
    factor: 3
    csam_kernel_size: 7
    output_attention: false

  train:
    val_fraction: 0.1

    train_stride: 1
    val_stride: 1
    test_stride: 1

    batch_size: 32
    epochs: 20

    learning_rate: 0.0001
    weight_decay: 0.0
    optimizer: adam

    gradient_clip_norm: 5.0

    early_stopping: true
    early_stopping_patience: 6

    seed: 42






# Run: /home/cc/spectrum-usage/.venv/bin/python3 -m training.common.grid_search
hyperparameter_search:
  enabled: true
  search_name: vanillalstm_powder_600_800
  smoke_test:
    enabled: true
    epochs: 5
  architecture_search:
    epochs: 15
    validation_stride: 5
    hidden_size: [8, 16, 32]
    num_layers: [1, 2, 3]
    dropout: [0.0, 0.1, 0.2]
    fixed:
      learning_rate: 0.001
      batch_size: 32
      weight_decay: 0.0001
      optimizer: adam
      gradient_clip_norm: 1.0
      early_stopping: true
      early_stopping_patience: 3
  optimization_search:
    epochs: 15
    validation_stride: 5
    top_architectures: 2
    learning_rate: [0.0005, 0.001, 0.003]
    batch_size: [32, 64]
    weight_decay: [0.0, 0.0001]
  selection:
    metric: mean_horizon_rmse_db
    mode: min
  output_dir: results/powder/600_800/hyperparameter_search
