# Hyperparameter search for OFA / GPT4TS (the third arm).
# Run: python -m training.grid_search.grid_search --config training/grid_search/config_ofa.yaml
#
# Three stages, same as config_convlstm.yaml: smoke (does it train at all) ->
# architecture -> optimization, with the top-k architectures carried forward. Results land
# in <output_dir>/results.csv and failed.csv, one YAML per trial under <output_dir>/configs/.
#
# The search evaluates an autoregressive rollout at t = 1, 5, 15, 60 (HORIZONS in
# grid_search.py), so every trial trains a one-step model and is scored on all four.

data:
  representation: 2d
  files:
    - {path: data/powder/humanities-nuc1/20260628T0436Z/600_800/power_1mhz_avg_per_minute.csv, partition: train}
    - {path: data/powder/humanities-nuc1/20260703T1839Z/600_800/power_1mhz_avg_per_minute.csv, partition: test}
  concat: rows
  chunks:
    - {id: powder_600_800, start_mhz: 600.0, end_mhz: 800.0}

windowing:
  lookback: 60
  horizons: [1, 5, 15, 60]

outputs:
  root_dir: results/powder/600_800

preprocessing: {normalize: true, impute: true, max_missing_gap: 9}
data_loader: {num_workers: 0, pin_memory: false}

training:
  device: auto
  model_name: ofa

ofa:
  evaluation: {}
  # OFA has no reprogramming stage and no prompt, so d_model, d_ff, num_prototypes and the
  # prompt_* keys do not exist here. The patches go straight into the backbone and only
  # layer norms and the positional embedding are fine-tuned. _inject_spectrumllm_params
  # raises if any of those keys appear in the search space below.
  model:
    input_sequence_length: 60
    prediction_horizon: 1
    patch_length: 16
    patch_stride: 8
    dropout: 0.1
    backbone: openai-community/gpt2
    llm_layers: 6
    revin_affine: false
    local_files_only: false
    channel_independent: false
  train:
    val_fraction: 0.15
    train_stride: 1
    val_stride: 1
    test_stride: 1
    batch_size: 16
    epochs: 20
    learning_rate: 0.001
    weight_decay: 0.0
    optimizer: adam
    gradient_clip_norm: 1.0
    early_stopping: true
    early_stopping_patience: 5
    seed: 42

hyperparameter_search:
  enabled: true
  search_name: ofa_powder_600_800

  smoke_test:
    enabled: true
    epochs: 2

  architecture_search:
    epochs: 8
    validation_stride: 10
    top_architectures: 2

    # With no d_model and no d_ff, the only architectural levers are the patching geometry
    # and the backbone depth.
    candidates:
      - {patch_length: 16, patch_stride: 8,  llm_layers: 6, channel_independent: false}
      - {patch_length: 16, patch_stride: 16, llm_layers: 6, channel_independent: false}
      - {patch_length: 8,  patch_stride: 4,  llm_layers: 6, channel_independent: false}
      - {patch_length: 8,  patch_stride: 8,  llm_layers: 6, channel_independent: false}
      - {patch_length: 16, patch_stride: 8,  llm_layers: 3, channel_independent: false}
      - {patch_length: 16, patch_stride: 8,  llm_layers: 12, channel_independent: false}
      - {patch_length: 16, patch_stride: 8,  llm_layers: 6, channel_independent: true}

    fixed:
      dropout: 0.1
      revin_affine: false
      backbone: openai-community/gpt2
      learning_rate: 0.001
      weight_decay: 0.0
      batch_size: 16
      optimizer: adam
      gradient_clip_norm: 1.0
      early_stopping: true
      early_stopping_patience: 3

  optimization_search:
    epochs: 15
    validation_stride: 10
    top_architectures: 2

    candidates:
      - {learning_rate: 0.0001, weight_decay: 0.0,    dropout: 0.1}
      - {learning_rate: 0.0001, weight_decay: 0.0001, dropout: 0.1}
      - {learning_rate: 0.0005, weight_decay: 0.0,    dropout: 0.0}
      - {learning_rate: 0.0005, weight_decay: 0.0,    dropout: 0.1}
      - {learning_rate: 0.0005, weight_decay: 0.0001, dropout: 0.3}
      - {learning_rate: 0.001,  weight_decay: 0.0,    dropout: 0.1}
      - {learning_rate: 0.001,  weight_decay: 0.0001, dropout: 0.1}
      - {learning_rate: 0.001,  weight_decay: 0.0001, dropout: 0.3}

  selection:
    metric: mean_horizon_rmse_db
    mode: min

  output_dir: results/powder/600_800/hyperparameter_search/ofa
