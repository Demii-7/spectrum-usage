# Run client commands from the repository root so this scoped key path resolves.
Host ray-tacc-*
    User cc
    ForwardAgent yes
    BatchMode yes
    ConnectTimeout 15
    StrictHostKeyChecking accept-new
    UserKnownHostsFile training/ray/docker/secrets/tacc_known_hosts

Host ray-tacc-1
    HostName 10.52.2.186
    ProxyJump ray-tacc-2

Host ray-tacc-2
    HostName 129.114.109.32

Host ray-tacc-3
    HostName 10.52.0.165
    ProxyJump ray-tacc-2

Host ray-tacc-4
    HostName 10.52.2.197
    ProxyJump ray-tacc-2
