# Run client commands from the repository root.
Host ray-new-* ray-worker-1 ray-worker-2 h100-head
    User cc
    ForwardAgent yes
    BatchMode yes
    ConnectTimeout 15
    StrictHostKeyChecking accept-new
    UserKnownHostsFile training/ray/docker/secrets/h100_known_hosts

Host ray-new-1
    HostName 129.114.25.96

Host ray-new-2
    HostName 192.168.1.219
    ProxyJump ray-worker-2

Host ray-new-3
    HostName 192.168.1.104
    ProxyJump ray-worker-2

Host ray-new-4
    HostName 192.168.1.82
    ProxyJump ray-worker-2

Host ray-worker-1
    HostName 129.114.26.81

Host ray-worker-2 h100-head
    HostName 129.114.27.86
