# Run client commands from the repository root.
Host ray-uc-*
    User cc
    ForwardAgent yes
    BatchMode yes
    ConnectTimeout 15
    StrictHostKeyChecking accept-new
    UserKnownHostsFile training/ray/docker/secrets/uc_known_hosts
    ControlMaster auto
    ControlPath /tmp/spectrum-uc-ssh-%C
    ControlPersist 10m

Host ray-uc-1
    HostName 192.5.87.177

Host ray-uc-extra-1
    HostName 192.5.87.163

Host ray-uc-2
    HostName 10.140.82.107
    ProxyJump ray-uc-1

Host ray-uc-3
    HostName 10.140.82.132
    ProxyJump ray-uc-1

Host ray-uc-4
    HostName 10.140.82.89
    ProxyJump ray-uc-1

Host ray-uc-5
    HostName 10.140.82.191
    ProxyJump ray-uc-1

Host ray-uc-6
    HostName 10.140.83.1
    ProxyJump ray-uc-1

Host ray-uc-7
    HostName 10.140.81.125
    ProxyJump ray-uc-1

Host ray-uc-8
    HostName 10.140.83.84
    ProxyJump ray-uc-1
