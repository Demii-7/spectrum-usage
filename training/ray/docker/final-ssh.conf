Host ray-final-1
    HostName 129.114.25.135

Host ray-final-2
    HostName 192.168.1.122
    ProxyJump ray-final-1

Host ray-final-3
    HostName 192.168.1.47
    ProxyJump ray-final-1

Host ray-final-4
    HostName 192.168.1.15
    ProxyJump ray-final-1

Host ray-final-5
    HostName 192.168.1.45
    ProxyJump ray-final-1

Host ray-final-6
    HostName 192.168.1.9
    ProxyJump ray-final-1

Host ray-final-*
    User cc
    ForwardAgent yes
    StrictHostKeyChecking accept-new
    UserKnownHostsFile training/ray/docker/secrets/final_known_hosts
    ServerAliveInterval 30
    ConnectTimeout 20
    ControlMaster auto
    ControlPath /tmp/spectrum-final-ssh-%C
    ControlPersist 10m
