# BENCHMARK config — our manuscript's protocol, NOT a reproduction of the SpectrumLLM article.
#   POWDER 600-800 MHz, 1-min sampling, lookback 60, horizons 1/15/60.
#   The article's regime (ElectroSense, 15-min, T=192, K=12..192) is reproduced by the separate
#   standalone script training/SpectrumLLM/repro/run_paper_regime.py, which shares only
#   models/SpectrumLLM.py with this path and never reads this file.
# Every model hyperparameter is written out explicitly below. Do not rely on the defaults in
#   models/SpectrumLLM.py: those are paper-faithful values (article first, Time-LLM where the
#   article is silent) and will move for reproduction reasons, which must not silently move the
#   benchmark. Training-schedule values here are the single-run anchor; the Ray sweep searches
#   learning_rate / weight_decay / batch_size from training/ray/registry.py.

data:
  representation: 2d
  files:
    - {path: data/powder/cpg-nuc1/20260628T0437Z/600_800/power_1mhz_avg_per_minute.csv, partition: train}
    - {path: data/powder/ebc-nuc1/20260628T0436Z/600_800/power_1mhz_avg_per_minute.csv, partition: train}
    - {path: data/powder/humanities-nuc1/20260628T0436Z/600_800/power_1mhz_avg_per_minute.csv, partition: train}
    - {path: data/powder/madsen-nuc1/20260628T0437Z/600_800/power_1mhz_avg_per_minute.csv, partition: train}
    - {path: data/powder/moran-nuc1/20260628T0437Z/600_800/power_1mhz_avg_per_minute.csv, partition: train}
    - {path: data/powder/sagepoint-nuc1/20260628T0437Z/600_800/power_1mhz_avg_per_minute.csv, partition: train}
    - {path: data/powder/cpg-nuc1/20260703T1839Z/600_800/power_1mhz_avg_per_minute.csv, partition: test}
    - {path: data/powder/ebc-nuc1/20260703T1839Z/600_800/power_1mhz_avg_per_minute.csv, partition: test}
    - {path: data/powder/humanities-nuc1/20260703T1839Z/600_800/power_1mhz_avg_per_minute.csv, partition: test}
    - {path: data/powder/madsen-nuc1/20260703T1839Z/600_800/power_1mhz_avg_per_minute.csv, partition: test}
    - {path: data/powder/moran-nuc1/20260703T1839Z/600_800/power_1mhz_avg_per_minute.csv, partition: test}
    - {path: data/powder/sagepoint-nuc1/20260703T1839Z/600_800/power_1mhz_avg_per_minute.csv, partition: test}
  concat: rows
  split:
    ranges:
      train: {start: "2026-06-28T04:37:00Z", end: "2026-07-02T02:23:00Z"}
      validation: {start: "2026-07-02T02:24:00Z", end: "2026-07-03T02:23:00Z"}
      test: {start: "2026-07-03T18:39:00Z", end: "2026-07-06T09:14:00Z"}
  chunks: [{id: powder_600_800_t4t6, start_mhz: 600.0, end_mhz: 800.0}]

windowing: {lookback: 60, horizons: [1, 15, 60]}
training:
  device: cuda
  models: [spectrumllm]
preprocessing: {normalize: true, impute: true, max_missing_gap: 9}
data_loader: {num_workers: 0, pin_memory: false}

spectrumllm:
  # architecture — explicit, benchmark-owned (see header)
  model: {input_sequence_length: 60, prediction_horizon: 1, patch_length: 16, patch_stride: 8,
          d_model: 32, d_ff: 32, num_prototypes: 1000, attention_heads: 8, dropout: 0.1,
          prompt_top_lags: 5, prompt_mode: static, backbone: openai-community/gpt2,
          llm_layers: 6, revin_affine: false, local_files_only: false}
  # schedule — benchmark-owned. These are the single-run anchor, matching registry.py's
  # anchor_optimizer (lr 1e-3, wd 0.0, batch 16); the Ray sweep overrides them. Time-LLM's own
  # schedule (lr 1e-4 / 10 epochs / batch 32) belongs to the reproduction script, not here: it was
  # chosen for 15-min ElectroSense data at T=192 and has no claim on POWDER at lookback 60.
  train: {val_fraction: 0.1, train_stride: 1, val_stride: 1, test_stride: 1, batch_size: 16,
          epochs: 20, learning_rate: 0.001, weight_decay: 0.0, optimizer: adam,
          gradient_clip_norm: 1.0, early_stopping: true, early_stopping_patience: 5, seed: 42}
