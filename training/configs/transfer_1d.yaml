data:
  representation: 1d
windowing:
  lookback: 60
  horizons: [1, 15, 60]
training:
  device: auto
preprocessing:
  normalize: true
  impute: true
  max_missing_gap: 10

vanillalstm1d:
  model:
    input_sequence_length: 60
    prediction_horizon: 1
    input_size: 1
    hidden_size: 8
    num_layers: 1
    dropout: 0.0
    output_strategy: final_hidden
    bidirectional: false
  train: {batch_size: 64, test_stride: 1, val_fraction: 0.15}
  evaluation: {batch_size: 64, test_stride: 1}

residualvanillalstm:
  model:
    input_sequence_length: 60
    prediction_horizon: 1
    input_size: 1
    hidden_size: 8
    num_layers: 1
    dropout: 0.0
    output_strategy: final_hidden
    bidirectional: false
  train: {batch_size: 64, test_stride: 1, val_fraction: 0.15}
  evaluation: {batch_size: 64, test_stride: 1}

linearar1d:
  model: {input_sequence_length: 60, prediction_horizon: 1, input_size: 1, ridge_alpha: 0.01}
  train: {batch_size: 256, test_stride: 1, val_fraction: 0.15}
  evaluation: {batch_size: 256, test_stride: 1}

residuallinearar1d:
  model: {input_sequence_length: 60, prediction_horizon: 1, input_size: 1, ridge_alpha: 0.01}
  train: {batch_size: 256, test_stride: 1, val_fraction: 0.15}
  evaluation: {batch_size: 256, test_stride: 1}
