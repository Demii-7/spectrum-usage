# Small 4D map smoke test for the paper-style Autoformer-CSA path.
data:
  representation: 4d
  reference_site: humanities
  files:
    - path: data/powder/guesthouse-nuc1/20260618T0036Z/600_800/power_1mhz_avg_per_minute.csv
      partition: train
    - path: data/powder/humanities-nuc1/20260618T0036Z/600_800/power_1mhz_avg_per_minute.csv
      partition: train
    - path: data/powder/guesthouse-nuc1/20260628T0436Z/600_800/power_1mhz_avg_per_minute.csv
      partition: test
    - path: data/powder/humanities-nuc1/20260628T0436Z/600_800/power_1mhz_avg_per_minute.csv
      partition: test
  map_key: map_db
  concat: rows
  max_rows: 2000
  chunks:
    - id: powder_600_800
      start_mhz: 600.0
      end_mhz: 800.0
  map:
    name: powder_600_800
    locations: data/locations/powder.json
    collection_key: endpoints
    output_dir: data/maps
    grid:
      height: 10
      width: 10
    force_rebuild: false
    permute: false
    permute_seed: 42

windowing:
  lookback: 96
  horizons: [60]

training:
  device: auto
  model_name: autoformer_csa

preprocessing:
  normalize: true
  impute: true
  max_missing_gap: 10

autoformer_csa:
  seq_len: 96
  label_len: 48
  pred_len: 60
  train_stride: 10
  val_stride: 10
  test_stride: 10
  val_fraction: 0.15
  batch_size: 32
  epochs: 1
  learning_rate: 0.0001
  optimizer: adam
  loss: rmse
  gradient_clip: 5.0
  early_stopping: false
  patience: 1
  seed: 42
  model:
    d_model: 32
    d_ff: 64
    encoder_layers: 2
    decoder_layers: 1
    n_heads: 4
    moving_avg: 25
    dropout: 0.05
    factor: 3
    csam_kernel_size: 7
    output_attention: false
