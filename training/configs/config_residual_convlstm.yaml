# Residual ConvLSTM diagnostic config
data:
  representation: 4d
  reference_site: humanities
  files:
    - path: data/powder/guesthouse-nuc1/20260618T0036Z/600_800/power_1mhz_avg_per_minute.csv
      partition: train
    - path: data/powder/humanities-nuc1/20260618T0036Z/600_800/power_1mhz_avg_per_minute.csv
      partition: train
    - path: data/powder/guesthouse-nuc1/20260628T0436Z/600_800/power_1mhz_avg_per_minute.csv
      partition: test
    - path: data/powder/humanities-nuc1/20260628T0436Z/600_800/power_1mhz_avg_per_minute.csv
      partition: test
  chunks:
    - id: powder_600_800
      start_mhz: 600.0
      end_mhz: 800.0
  map:
    name: powder_600_800
    locations: data/locations/powder.json
    collection_key: endpoints
    output_dir: data/maps
    grid:
      height: 10
      width: 10
    force_rebuild: false
    permute: false
    permute_seed: 42

windowing:
  lookback: 60
  horizons: [1, 5, 15, 60]

preprocessing:
  normalize: true
  impute: true
  max_missing_gap: 5

training:
  device: auto
  models:
    - lookbackmean4d
    - linearar4d
    - convlstm
    - residualconvlstm

data_loader:
  num_workers: 4
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: auto

lookbackmean4d:
  evaluation: {}
  model:
    input_sequence_length: 60
    prediction_horizon: 1
  train:
    val_fraction: 0.15
    train_stride: 1
    val_stride: 10
    test_stride: 1
    batch_size: 32
    epochs: 1
    learning_rate: 0.0
    weight_decay: 0.0
    optimizer: adam
    gradient_clip_norm: 1.0
    early_stopping: false
    early_stopping_patience: 10
    seed: 42

linearar4d:
  evaluation: {}
  model:
    input_sequence_length: 60
    prediction_horizon: 1
    ridge_alpha: 1.0
  train:
    val_fraction: 0.15
    train_stride: 1
    val_stride: 10
    test_stride: 1
    batch_size: 32
    epochs: 1
    learning_rate: 0.001
    weight_decay: 0.0
    optimizer: adam
    gradient_clip_norm: 1.0
    early_stopping: false
    early_stopping_patience: 10
    seed: 42

convlstm:
  evaluation: {}
  model:
    input_sequence_length: 60
    prediction_horizon: 60
    hidden_channels: [16]
    kernel_size: [[1, 3]]
    num_encoder_layers: 1
    decoder_hidden_channels: 16
    decoder_kernel_size: [1, 3]
    decoder_lstm_hidden: 64
    dropout: 0.1
    use_batch_norm: false
    fc_hidden_channels: 0
    fc_kernel_size: [1, 3]
    fc_intermediate_activation: relu
    cell_activation: tanh
    use_channel_projection: false
    channel_projection_dim: 16
  train:
    val_fraction: 0.15
    train_stride: 10
    val_stride: 10
    test_stride: 1
    batch_size: 32
    epochs: 20
    learning_rate: 0.0002
    weight_decay: 0.004
    optimizer: adam
    gradient_clip_norm: 5.0
    validation_prediction_magnitude_threshold: 20.0
    early_stopping: true
    early_stopping_patience: 5
    seed: 42

residualconvlstm:
  evaluation: {}
  model:
    input_sequence_length: 60
    prediction_horizon: 60
    hidden_channels: [16]
    kernel_size: [[1, 3]]
    num_encoder_layers: 1
    decoder_hidden_channels: 16
    decoder_kernel_size: [1, 3]
    decoder_lstm_hidden: 64
    dropout: 0.1
    use_batch_norm: false
    fc_hidden_channels: 0
    fc_kernel_size: [1, 3]
    fc_intermediate_activation: relu
    cell_activation: tanh
    use_channel_projection: false
    channel_projection_dim: 16
  train:
    val_fraction: 0.15
    train_stride: 10
    val_stride: 10
    test_stride: 1
    batch_size: 32
    epochs: 20
    learning_rate: 0.0002
    weight_decay: 0.004
    optimizer: adam
    gradient_clip_norm: 5.0
    validation_prediction_magnitude_threshold: 20.0
    early_stopping: true
    early_stopping_patience: 5
    seed: 42

evaluation: {}
