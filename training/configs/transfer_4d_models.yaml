data:
  representation: 4d
windowing: {lookback: 60, horizons: [1, 15, 60]}
preprocessing: {normalize: true, impute: true, max_missing_gap: 9}

convlstm:
  model:
    input_sequence_length: 60
    prediction_horizon: 1
    hidden_channels: [32, 64]
    kernel_size: [[1, 3], [1, 1]]
    num_encoder_layers: 2
    decoder_hidden_channels: 32
    decoder_kernel_size: [1, 1]
    decoder_lstm_hidden: 128
    dropout: 0.3
    use_batch_norm: false
    fc_hidden_channels: 0
    fc_kernel_size: [1, 3]
    fc_intermediate_activation: relu
    cell_activation: tanh
    use_channel_projection: false
    channel_projection_dim: 16
  evaluation: {batch_size: 4, test_stride: 1}

residualconvlstm:
  model:
    input_sequence_length: 60
    prediction_horizon: 1
    hidden_channels: [16, 32]
    kernel_size: [[1, 3], [1, 1]]
    num_encoder_layers: 2
    decoder_hidden_channels: 16
    decoder_kernel_size: [1, 1]
    decoder_lstm_hidden: 64
    dropout: 0.1
    use_batch_norm: false
    fc_hidden_channels: 0
    fc_kernel_size: [1, 3]
    fc_intermediate_activation: relu
    cell_activation: tanh
    use_channel_projection: false
    channel_projection_dim: 16
  evaluation: {batch_size: 4, test_stride: 1}

linearar4d:
  model: {input_sequence_length: 60, prediction_horizon: 1, ridge_alpha: 0.01}
  evaluation: {batch_size: 16, test_stride: 1}

residuallinearar4d:
  model: {input_sequence_length: 60, prediction_horizon: 1, ridge_alpha: 0.01}
  evaluation: {batch_size: 16, test_stride: 1}

dswinlstm_i:
  model:
    input_sequence_length: 60
    prediction_horizon: 60
    patch_shape: [1, 1]
    embed_dim: 32
    hidden_dims: [32, 64]
    encoder_units: 2
    decoder_units: 2
    swin_depths: [1, 2, 2, 1]
    num_heads: [2, 4, 4, 2]
    window_size: 2
    use_patch_merging: true
    use_patch_expanding: true
    use_imputation_unit: true
    mask_as_input_channel: false
    output_activation: none
    decoder_feedback: pixel_feedback
    padding_mode: reflect
    drop_path_rate: 0.0
  evaluation: {batch_size: 2, test_stride: 1}

lookbackmean4d:
  model: {input_sequence_length: 60, prediction_horizon: 1}
  evaluation: {batch_size: 16, test_stride: 1}
