data:
  dataset_path: "training/data/cc2_smoke_test.csv"
  n_features: 250
  n_nodes: 1
  bins_per_node: 250
  node_names: ["CC2"]

preprocessing:
  normalization: "revin_only"
  fit_on_train_only: true

windowing:
  input_sequence_length: 12
  prediction_horizon: 6
  train_stride: 1
  val_stride: 6
  test_stride: 6
  stride: 1

split:
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1
  chronological_split: true

model:
  checkpoint_size: "base"
  use_timeran_checkpoint: true
  task: "forecasting"
  freeze_backbone: true
  train_head_only: true

training:
  batch_size: 16
  epochs: 5
  learning_rate: 1.0e-5
  max_learning_rate: 1.0e-4
  optimizer: "adam"
  scheduler: "onecycle"
  scheduler_factor: 0.5
  scheduler_patience: 5
  max_norm: 5.0
  seed: 42

comparison:
  compare_raw_moment: true

evaluation:
  metrics: ["rmse", "mae"]
  eval_horizons: [1, 3, 6]

device:
  device: "auto"
