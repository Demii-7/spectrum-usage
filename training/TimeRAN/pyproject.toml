[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrum-usage-timeran"
version = "0.1.0"
description = "TimeRAN dependencies for spectrum-usage"
requires-python = ">=3.10,<3.12"
dependencies = [
    "gdown>=5,<7",
    "matplotlib==3.8.2",
    "momentfm==0.1.4",
    "numpy==1.25.2",
    "pandas==2.1.4",
    "pyyaml>=6,<7",
    "scikit-learn==1.3.2",
    "scipy==1.11.4",
    "tqdm>=4,<5",
]

[tool.setuptools]
py-modules = []
